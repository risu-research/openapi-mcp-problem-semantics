name: RISU P5-D Windows and Linux First-use Performance and Repository Coverage
on:
  push:
    branches:
      - qualification/p5d-cross-platform-firstuse-benchmark-20261106
    paths:
      - p5d/**
      - .github/workflows/risu-p5d-windows-firstuse-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pinned-baseline-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact previously CI-installed P5-C wheel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path p5d/baseline | Out-Null
          gh run download 42320603656 --repo '${{ github.repository }}' --name risu-p5c-single-wheel-zero-config-and-real-consumer-replay --dir p5d/baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve previous exact CI wheel' }
          python -c "import hashlib,pathlib; p=pathlib.Path('p5d/baseline/p5c/wheels/risu_probe_preview-0.9.18.dev0-py3-none-any.whl'); assert p.exists(); assert hashlib.sha256(p.read_bytes()).hexdigest()=='6bdfa3cfc9fef675aa30cb94d30b546789b1f005a4c9f5df927def19b3e3c8d5'; print('PINNED_P5C_WHEEL_SHA256_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'P5-C baseline wheel hash mismatch' }
      - name: Build and actually install P5-D single wheel, regression tests, and pinned 10 repo benchmark
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'setuptools>=68' wheel
          if ($LASTEXITCODE -ne 0) { throw 'Build tools unavailable' }
          python p5d/ci_driver.py --base-wheel p5d/baseline/p5c/wheels/risu_probe_preview-0.9.18.dev0-py3-none-any.whl --repeat 3
          if ($LASTEXITCODE -ne 0) { throw 'P5-D cross-platform quality regression' }
      - name: Publish full benchmark and installed wheel evidence per OS
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risu-p5d-firstuse-${{ runner.os }}
          path: |
            p5d/results/**
            p5d/wheels/*.whl
            p5d/*.py
            p5d/tests/*.py
            p5d/README_KO.md
            p5d/external_repos.json
          if-no-files-found: warn
          retention-days: 30
