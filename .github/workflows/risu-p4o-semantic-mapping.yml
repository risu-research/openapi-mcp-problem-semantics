name: RISU P4-O Observed Semantic Mappings on Third-Party Original JPO Wire
on:
  push:
    branches:
      - qualification/p4o-observed-semantic-schema-mapping-20261106
    paths:
      - p4o/**
      - .github/workflows/risu-p4o-semantic-mapping.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-third-party-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze and validate source/trust boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q p4n
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('p4n/FROZEN_SOURCES.json').read_text())
          assert p['original_commit']=='e7f0bcf2175823baaceb4844e84f9fc10ef00b40'
          assert len(p['cases'])==2
          assert p['cases']['normal']['upstream_http_status']==200
          assert p['cases']['logical_not_found']['upstream_http_status']==200
          assert p['cases']['logical_not_found']['application_status_code']=='107'
          print('P4N_FROZEN_SOURCE_AND_REPLAY_BOUNDARY_PASS')
          PY
      - name: Checkout exact original third-party project commit, never mutable HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p4n/external_upstream
          git -C p4n/external_upstream init -q
          git -C p4n/external_upstream remote add origin https://github.com/parkerhancock/patent-client-agents.git
          git -C p4n/external_upstream -c protocol.version=2 fetch --no-tags --depth 1 origin e7f0bcf2175823baaceb4844e84f9fc10ef00b40
          git -C p4n/external_upstream checkout -q --detach FETCH_HEAD
          test "$(git -C p4n/external_upstream rev-parse HEAD)" = "e7f0bcf2175823baaceb4844e84f9fc10ef00b40"
          echo "P4N_PINNED_EXTERNAL_PROJECT_GIT_CHECKOUT_PASS"
      - name: Install external project's FROZEN dependency lock + original test VCR tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q uv==0.11.10
          cd p4n/external_upstream
          uv sync --frozen --extra mcp --no-dev --python "$(command -v python)"
          uv pip install --python .venv/bin/python 'vcrpy>=8.0,<9' 'pytest>=8,<10'
          .venv/bin/python - <<'PY'
          import importlib.metadata
          import fastmcp, vcr
          import patent_client_agents
          print('P4N_THIRD_PARTY_ENV_READY',
                importlib.metadata.version('fastmcp'),
                importlib.metadata.version('vcrpy'),
                importlib.metadata.version('patent-client-agents'))
          PY
      - name: Real stdio JSON-RPC MCP wire, with offline-only original HTTP cassette replay
        shell: bash
        env:
          JPO_API_USERNAME: REDACTED_USERNAME
          JPO_API_PASSWORD: REDACTED_PASSWORD
          P4N_REPLAY_ONLY: '1'
        run: |
          set -euo pipefail
          mkdir -p p4n/results
          p4n/external_upstream/.venv/bin/python -u p4n/drive_wire.py \
            --external p4n/external_upstream \
            --out p4n/results
          test -s p4n/results/normal/observed_stdio_wire.jsonl
          test -s p4n/results/logical_not_found/observed_stdio_wire.jsonl
      - name: Extract independent evidence receipt and assert no live upstream HTTP / causal overclaim
        shell: bash
        run: |
          set -euo pipefail
          p4n/external_upstream/.venv/bin/python p4n/independent_audit.py --out p4n/results --external p4n/external_upstream
      - name: Derive HAR 1.2 and MCP JSONL with explicit replay-only provenance
        shell: bash
        run: |
          set -euo pipefail
          p4n/external_upstream/.venv/bin/python p4n/export_native.py \
            --external p4n/external_upstream --out p4n/results
      - name: Rebuild the unmodified P4-J RISU Probe from SHA-pinned upgrades
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q setuptools wheel PyYAML==6.0.2 cryptography
          python ci/export_v09_source_portable.py
          python ci/upgrade_v10_modules.py
          python ci/upgrade_v11_semantics.py
          python ci/upgrade_v12_decision_witness.py
          python ci/upgrade_v13_repro.py
          python ci/upgrade_v14_fixverify.py
          python ci/upgrade_v15_openapi_compat.py
          python p4g/apply_upgrade.py
          python p4h/apply_upgrade.py
          python p4j/apply_upgrade.py
          mkdir -p p4n/results/installer
          python -m pip wheel --no-deps --no-build-isolation -w p4n/results/installer dist/risu_v09_source
          uv pip install --python p4n/external_upstream/.venv/bin/python --no-deps --reinstall \
            p4n/results/installer/risu_probe_preview-0.9.10.dev0-py3-none-any.whl
      - name: Use native RISU CLI once per original HTTP plus actual MCP wire pair
        shell: bash
        run: |
          set -euo pipefail
          CLI=p4n/external_upstream/.venv/bin/risu-probe
          "$CLI" analyze p4n/results/risu_native_inputs/normal --recovery \
            --format json --out p4n/results/normal/risu_product_diagnosis.json
          "$CLI" analyze p4n/results/risu_native_inputs/logical_not_found --recovery \
            --format json --out p4n/results/logical_not_found/risu_product_diagnosis.json
          python - <<'PY'
          from pathlib import Path
          import json
          for name in ('normal','logical_not_found'):
              p=Path('p4n/results')/name/'risu_product_diagnosis.json'
              d=json.loads(p.read_text())
              assert len(d['results'])==1
              assert d['causal_gate_v1']['summary']['CONFIRMED_LOSS']==0
              assert d['capture_v1']['source_inference'] is False if 'capture_v1' in d else True
              print('P4N_ONE_COMMAND_PRODUCT_DIAGNOSIS',name,
                    {'raw_verdict':d['results'][0]['verdict'],
                     'causal_outcome':d['results'][0]['causal_v1']['outcome'],
                     'confirmed_loss':d['causal_gate_v1']['summary']['CONFIRMED_LOSS']})
          PY
      - name: Audit the product's raw syntactic LOSS against original JPO semantics
        shell: bash
        run: |
          set -euo pipefail
          python p4n/qualify_semantics.py --out p4n/results
      - name: Upgrade pinned unchanged P4-J to opt-in v0.9.11 scoped semantic mapping lens
        shell: bash
        run: |
          set -euo pipefail
          python p4o/apply_upgrade.py
          python -m compileall -q dist/risu_v09_source p4o
          python -m pip wheel --no-deps --no-build-isolation -w p4n/results/installer dist/risu_v09_source
          uv pip install --python p4n/external_upstream/.venv/bin/python --no-deps --reinstall \
            p4n/results/installer/risu_probe_preview-0.9.11.dev0-py3-none-any.whl
          p4n/external_upstream/.venv/bin/risu-probe --version
      - name: Test P4-J signed witness regression unchanged and semantic mapping against actual SDK wire
        shell: bash
        run: |
          set -euo pipefail
          test ! -e p4j/src && ln -s ../dist/risu_v09_source p4j/src
          PYTHONPATH=dist/risu_v09_source python -m unittest discover -s p4j/tests -p test_causal_gate.py -v
          python -m unittest discover -s p4o/tests -p test_real_jpo_semantics.py -v
      - name: Verify all eight declared JPO field and lookup transitions using installed CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI=p4n/external_upstream/.venv/bin/risu-probe
          mkdir -p p4n/results/semantic_maps
          python - <<'PY'
          import json
          from pathlib import Path
          full=json.loads(Path('p4o/fixtures/jpo_observed_mapping.json').read_text())
          for name in ('normal','logical_not_found'):
              subset={'schema':full['schema'],'cases':[x for x in full['cases'] if x['case_id']=='JPO_'+name]}
              assert len(subset['cases'])==1
              Path('p4n/results/semantic_maps/'+name+'.json').write_text(json.dumps(subset,sort_keys=True)+'\n')
          PY
          for name in normal logical_not_found; do
            "$CLI" analyze "p4n/results/risu_native_inputs/$name" \
              --recovery --semantic-map "p4n/results/semantic_maps/$name.json" \
              --fail-on-semantic-contradiction \
              --format json --out "p4n/results/$name/p4o_semantic_diagnosis.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          expected={'normal':7,'logical_not_found':1}
          for name,checks in expected.items():
              d=json.loads((Path('p4n/results')/name/'p4o_semantic_diagnosis.json').read_text())
              s=d['semantic_mapping_v1']
              assert s['rules_summary']=={'OBSERVED_MATCH':checks,'CONTRADICTED':0,'INSUFFICIENT':0},(name,s)
              assert s['cases_summary']=={'ALL_DECLARED_CHECKS_MATCH':1,'DECLARED_MAPPING_CONTRADICTED':0,'DECLARED_MAPPING_INSUFFICIENT':0,'NOT_ASSESSED':0}
              assert s['all_passing_is_not_full_semantic_preservation']
              assert d['results'][0]['verdict']=='LOSS'
              assert d['results'][0]['decision_v1']['outcome']=='REVIEW'
              assert d['causal_gate_v1']['summary']['CONFIRMED_LOSS']==0
              assert d['results'][0]['causal_v1']['outcome']=='CONDITIONAL_MISMATCH'
              old=json.loads((Path('p4n/results')/name/'risu_product_diagnosis.json').read_text())
              assert old['results'][0]['losses']==d['results'][0]['losses']
              assert old['causal_gate_v1']['summary']==d['causal_gate_v1']['summary']
              assert 'semantic_mapping_v1' not in old
              print('P4O_ACTUAL_EXTERNAL_ORIGINAL_VCR_REAL_MCP_SCOPED_MAPPING_PASS',name,checks,flush=True)
          PY
      - name: Independent P4-O post-install audit and counterexample checks
        shell: bash
        run: |
          set -euo pipefail
          python p4o/independent_audit.py --results p4n/results \
            --contract p4o/fixtures/jpo_observed_mapping.json
      - name: Upload raw actual STDIO JSON-RPC wire from our REPLAY, not third-party original wire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risu-p4o-original-JPO-real-wire-semantic-v0911-verified
          path: |
            p4n/FROZEN_SOURCES.json
            p4n/drive_wire.py
            p4n/export_native.py
            p4n/qualify_semantics.py
            p4n/replay_original_jpo_subserver.py
            p4n/independent_audit.py
            p4n/results/summary.json
            p4n/results/product_semantic_interpretation.json
            p4n/results/independent_audit.json
            p4n/results/normal/observed_stdio_wire.jsonl
            p4n/results/normal/case_report.json
            p4n/results/logical_not_found/observed_stdio_wire.jsonl
            p4n/results/logical_not_found/case_report.json
            p4n/results/normal/risu_product_diagnosis.json
            p4n/results/logical_not_found/risu_product_diagnosis.json
            p4n/results/risu_native_inputs/normal/DERIVATION_PROVENANCE.json
            p4n/results/risu_native_inputs/logical_not_found/DERIVATION_PROVENANCE.json
            p4n/results/installer/risu_probe_preview-0.9.10.dev0-py3-none-any.whl
            p4n/results/installer/risu_probe_preview-0.9.11.dev0-py3-none-any.whl
            p4o/overrides/risu_semantics.py
            p4o/fixtures/jpo_observed_mapping.json
            p4o/apply_upgrade.py
            p4o/tests/test_real_jpo_semantics.py
            p4o/independent_audit.py
            p4n/results/normal/p4o_semantic_diagnosis.json
            p4n/results/logical_not_found/p4o_semantic_diagnosis.json
            p4n/results/p4o_independent_audit.json
            p4n/results/semantic_maps/normal.json
            p4n/results/semantic_maps/logical_not_found.json
          if-no-files-found: warn
