name: RISU Probe v0.9.3 calibrated evidence CI
on:
  push:
    branches:
      - experiment/risu-probe-v093-evidence-calibrated-20261105
    paths:
      - product_v11/**
      - ci/upgrade_v11_semantics.py
      - ci/test_v093_evidence.py
      - ci/test_v10_regressions.py
      - triad/**
      - .github/workflows/risu-v093-evidence-calibrated.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  portable-evidence:
    name: "Evidence, lifecycle, wheel: ${{ matrix.os }} Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore cryptographically pinned baseline
        shell: bash
        run: |
          python ci/export_v09_source_portable.py
          python ci/upgrade_v10_modules.py
          python ci/upgrade_v11_semantics.py
          python -m compileall -q dist/risu_v09_source
      - name: Run 24 semantic accuracy tests plus 150 metamorphic mutations
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q --upgrade setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/wheels dist/risu_v09_source
          python -m pip install --no-index --no-deps --force-reinstall dist/wheels/risu_probe_preview-0.9.3.dev0-py3-none-any.whl
          python ci/test_v093_evidence.py
          python ci/test_v10_regressions.py
          python dist/risu_v09_source/risu_probe.py --version
          risu-probe --version
      - name: Export qualified wheel and source digest
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: risu-v093-evidence-calibrated-wheel
          path: |
            dist/wheels/risu_probe_preview-0.9.3.dev0-py3-none-any.whl
            dist/risu_v09_source/risu_evidence.py
            dist/risu_v09_source/risu_probe.py
            dist/risu_v09_source/risu_analyze.py
            dist/risu_v09_source/risu_verify.py
            dist/risu_v09_source/pyproject.toml
          if-no-files-found: error

  actual-three-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore v0.9.3 on authenticated v0.9.1 baseline
        run: |
          python ci/export_v09_source_portable.py
          python ci/upgrade_v10_modules.py
          python ci/upgrade_v11_semantics.py
          python -m compileall -q dist/risu_v09_source
      - name: Install independent project dependencies in disposable container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          chmod 777 results
          date +%s > results/begin_unix.txt
          docker build --pull -f triad/Dockerfile -t risu-v093-triad .
      - name: Offline localhost fixture against 3 actual MCP generators
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --pids-limit 160 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --mount type=bind,src="$PWD/results",dst=/results \
            risu-v093-triad
          date +%s > results/end_unix.txt
      - name: Independent evidence and mutation audit
        run: python triad/audit_results.py results
      - name: Retain redacted source hashes and independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risu-v093-three-project-calibrated-evidence
          path: |
            results/THREE_PROJECTS_SUMMARY.json
            results/INDEPENDENT_AUDIT.json
            results/begin_unix.txt
            results/end_unix.txt
          if-no-files-found: warn
