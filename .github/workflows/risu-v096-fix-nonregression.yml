name: RISU Probe v0.9.6 P3 regression-safe Fix Verification CI
on:
  push:
    branches:
      - experiment/risu-probe-v096-fix-nonregression-20261105
    paths:
      - product_v11/**
      - product_v12/**
      - product_v13/**
      - product_v14/**
      - ci/upgrade_v14_fixverify.py
      - apps/**
      - ci/upgrade_v13_repro.py
      - ci/upgrade_v11_semantics.py
      - ci/upgrade_v12_decision_witness.py
      - ci/test_v094_decision_witness.py
      - ci/test_v093_evidence.py
      - ci/test_v10_regressions.py
      - triad/**
      - .github/workflows/risu-v096-real-app-reproducer.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  portable-evidence:
    name: "Evidence, lifecycle, wheel: ${{ matrix.os }} Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore cryptographically pinned baseline
        shell: bash
        run: |
          python -m py_compile ci/upgrade_v12_decision_witness.py product_v12/risu_decision.py product_v12/risu_witness.py ci/test_v094_decision_witness.py
          python ci/export_v09_source_portable.py
          python ci/upgrade_v10_modules.py
          python ci/upgrade_v11_semantics.py
          python ci/upgrade_v12_decision_witness.py
          python ci/upgrade_v13_repro.py
          python ci/upgrade_v14_fixverify.py
          python -m compileall -q dist/risu_v09_source
      - name: Test real-app fix modules, reproducible CLI, P0 and all inherited tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q --upgrade setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/wheels dist/risu_v09_source
          python -m pip install --no-index --no-deps --force-reinstall dist/wheels/risu_probe_preview-0.9.6.dev0-py3-none-any.whl
          python ci/test_v093_evidence.py
          python ci/test_v094_decision_witness.py
          python apps/test_repro_unit.py
          python apps/test_repro_cli.py
          python apps/test_v096_fixverify.py
          python ci/test_v10_regressions.py
          python dist/risu_v09_source/risu_probe.py --version
          risu-probe --version
      - name: Export qualified wheel and source digest
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: risu-v096-policy-witness-wheel
          path: |
            dist/wheels/risu_probe_preview-0.9.6.dev0-py3-none-any.whl
            dist/risu_v09_source/risu_evidence.py
            dist/risu_v09_source/risu_decision.py
            dist/risu_v09_source/risu_witness.py
            dist/risu_v09_source/risu_repair.py
            dist/risu_v09_source/risu_minimize.py
            dist/risu_v09_source/risu_reproduce.py
            dist/risu_v09_source/risu_fixverify.py
            dist/risu_v09_source/risu_report.py
            dist/risu_v09_source/risu_static.py
            dist/risu_v09_source/risu_probe.py
            dist/risu_v09_source/risu_analyze.py
            dist/risu_v09_source/risu_verify.py
            dist/risu_v09_source/risu_onboarding.py
            dist/risu_v09_source/pyproject.toml
            ci/upgrade_v12_decision_witness.py
            ci/upgrade_v13_repro.py
            ci/upgrade_v14_fixverify.py
            apps/**
            ci/upgrade_v11_semantics.py
            ci/upgrade_v10_modules.py
            ci/export_v09_source_portable.py
            ci/test_v094_decision_witness.py
            ci/test_v093_evidence.py
            ci/test_v10_regressions.py
            triad/run_three.py
            triad/audit_results.py
            triad/Dockerfile
            triad/fastmcp_openapi_server.py
            .github/workflows/risu-v096-real-app-reproducer.yml
          if-no-files-found: error

  actual-three-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore v0.9.6 on authenticated v0.9.1 baseline
        run: |
          python -m py_compile ci/upgrade_v12_decision_witness.py product_v12/risu_decision.py product_v12/risu_witness.py ci/test_v094_decision_witness.py
          python ci/export_v09_source_portable.py
          python ci/upgrade_v10_modules.py
          python ci/upgrade_v11_semantics.py
          python ci/upgrade_v12_decision_witness.py
          python ci/upgrade_v13_repro.py
          python ci/upgrade_v14_fixverify.py
          python -m compileall -q dist/risu_v09_source
      - name: Install independent project dependencies in disposable container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          chmod 777 results
          date +%s > results/begin_unix.txt
          docker build --pull -f triad/Dockerfile -t risu-v096-triad .
      - name: Offline localhost fixture against 3 actual MCP generators
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --pids-limit 160 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --mount type=bind,src="$PWD/results",dst=/results \
            risu-v096-triad
          date +%s > results/end_unix.txt
      - name: Independent P0 decision and two-consumer witness audit
        run: python triad/audit_results.py results
      - name: Retain redacted source hashes and independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risu-v096-three-project-witness-evidence
          path: |
            results/THREE_PROJECTS_SUMMARY.json
            results/INDEPENDENT_AUDIT.json
            results/begin_unix.txt
            results/end_unix.txt
          if-no-files-found: warn

  actual-external-sdk-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact v0.9.6 product from all pinned prior versions
        run: |
          python ci/export_v09_source_portable.py
          python ci/upgrade_v10_modules.py
          python ci/upgrade_v11_semantics.py
          python ci/upgrade_v12_decision_witness.py
          python ci/upgrade_v13_repro.py
          python ci/upgrade_v14_fixverify.py
          python -m compileall -q dist/risu_v09_source apps
      - name: Build two genuine pinned SDKs and MCPGen in disposable Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          chmod 777 results
          date +%s > results/begin_unix.txt
          docker build --pull -f apps/Dockerfile -t risu-v096-real-apps .
      - name: Actual pinned SDK failures, 6 positive/negative controls, 1-minimal replay and repair
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --pids-limit 160 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --mount type=bind,src="$PWD/results",dst=/results \
            risu-v096-real-apps
      - name: Independent replay BEFORE bridge patch, failure expected
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --mount type=bind,src="$PWD/results",dst=/results \
            --entrypoint /opt/sdk/bin/python \
            risu-v096-real-apps -B /opt/risu/apps/replay_generated.py \
            /results/repro_package/fixtures \
            --bridge /results/repro_package/consumer_bridge.py --expect broken
      - name: Independent replay AFTER patch, 2 repaired SDK decisions plus 6 nonregression controls
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --mount type=bind,src="$PWD/results",dst=/results \
            --entrypoint /opt/sdk/bin/python \
            risu-v096-real-apps -B /opt/risu/apps/replay_generated.py \
            /results/repro_package/fixtures \
            --bridge /results/repro_package/consumer_bridge_fixed.py --expect repaired
          date +%s > results/end_unix.txt
      - name: Independent audit of all 10 live GETs, no-regression and minimal-repair artifacts
        run: |
          PYTHONPATH=dist/risu_v09_source python apps/audit_results.py results
      - name: Export complete minimal executable fix and authentic SDK findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risu-v096-p3-fix-nonregression-evidence
          path: |
            results/REAL_APPS_SUMMARY.json
            results/INDEPENDENT_AUDIT.json
            results/repro_package/**
            results/begin_unix.txt
            results/end_unix.txt
          if-no-files-found: warn
